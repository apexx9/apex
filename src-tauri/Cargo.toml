[package]
name = "apex"
version = "0.1.0"
description = "APEX embedded systems IDE"
authors = ["Apex"]
edition = "2021"

[lib]
name = "apex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
serialport = { version = "4.7", default-features = false }
rfd = "0.15"
